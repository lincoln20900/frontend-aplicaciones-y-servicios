<div class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h5 class="card-title">Listado de Veterinarios</h5>
          </div>
          <div class="card-body">
            <!-- Indicador de carga -->
            <div *ngIf="loading" class="alert alert-info">
              <p>Cargando datos...</p>
            </div>

            <!-- Mensaje de error -->
            <div *ngIf="error" class="alert alert-danger">
              {{ error }}
            </div>

            <!-- Tabla de veterinarios -->
            <div *ngIf="!loading && veterinarios.length > 0" class="table-responsive">
              <table class="table table-striped table-hover">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Especialidad</th>
                    <th>ID Sede</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let veterinario of veterinarios">
                    <td>{{ veterinario.id }}</td>
                    <td>{{ veterinario.nombre }}</td>
                    <td>{{ veterinario.especialidad }}</td>
                    <td>{{ veterinario.sede_id }}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Mensaje cuando no hay veterinarios -->
            <div *ngIf="!loading && veterinarios.length === 0 && !error" class="alert alert-warning">
              No hay veterinarios para mostrar
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
