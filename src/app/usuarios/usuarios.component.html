<div class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header d-flex align-items-center justify-content-between">
            <h5 class="card-title mb-0">Listado de Usuarios</h5>
            <button class="btn btn-primary" (click)="abrirModalCrear()">
              <i class="now-ui-icons ui-1_simple-add"></i> Nuevo Usuario
            </button>
          </div>
          <div class="card-body">
            <div *ngIf="loading" class="alert alert-info">
              <p>Cargando datos...</p>
            </div>

            <div *ngIf="error" class="alert alert-danger">
              {{ error }}
            </div>

            <div *ngIf="!loading && usuarios.length > 0" class="table-responsive">
              <table class="table table-striped table-hover">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Cliente ID</th>
                    <th>Veterinario ID</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let usuario of usuarios">
                    <td>{{ usuario.id }}</td>
                    <td>{{ usuario.email }}</td>
                    <td>{{ usuario.rol }}</td>
                    <td>{{ usuario.cliente_id ?? 'N/A' }}</td>
                    <td>{{ usuario.veterinario_id ?? 'N/A' }}</td>
                    <td>
                      <button class="btn btn-sm btn-warning me-1" (click)="editarUsuario(usuario)">
                        <i class="now-ui-icons ui-2_settings-90"></i>
                      </button>
                      <button class="btn btn-sm btn-danger" (click)="eliminarUsuario(usuario.id)">
                        <i class="now-ui-icons ui-1_simple-remove"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div *ngIf="!loading && usuarios.length === 0 && !error" class="alert alert-warning">
              No hay usuarios para mostrar
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" #crearUsuarioModal id="crearUsuarioModal" tabindex="-1" aria-labelledby="crearUsuarioModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="crearUsuarioModalLabel">Crear Usuario</h5>
        <button type="button" class="btn-close" (click)="cerrarModal()" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" [(ngModel)]="nuevoUsuario.email" name="crearEmail" required>
          </div>
          <div class="mb-3">
            <label>Rol</label>
            <select class="form-control" [(ngModel)]="nuevoUsuario.rol" name="crearRol">
              <option value="cliente">cliente</option>
              <option value="veterinario">veterinario</option>
              <option value="admin">admin</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Cliente ID</label>
            <input type="number" class="form-control" [(ngModel)]="nuevoUsuario.cliente_id" name="crearClienteId">
          </div>
          <div class="mb-3">
            <label>Veterinario ID</label>
            <input type="number" class="form-control" [(ngModel)]="nuevoUsuario.veterinario_id" name="crearVeterinarioId">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearUsuario()">Crear</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" #editarUsuarioModal id="editarUsuarioModal" tabindex="-1" aria-labelledby="editarUsuarioModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title" id="editarUsuarioModalLabel">Editar Usuario</h5>
        <button type="button" class="btn-close" (click)="cerrarModal()" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label>ID</label>
            <input type="text" class="form-control" [(ngModel)]="usuarioForm.id" name="editarId" readonly>
          </div>
          <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" [(ngModel)]="usuarioForm.email" name="editarEmail" required>
          </div>
          <div class="mb-3">
            <label>Rol</label>
            <select class="form-control" [(ngModel)]="usuarioForm.rol" name="editarRol">
              <option value="cliente">cliente</option>
              <option value="veterinario">veterinario</option>
              <option value="admin">admin</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Cliente ID</label>
            <input type="number" class="form-control" [(ngModel)]="usuarioForm.cliente_id" name="editarClienteId">
          </div>
          <div class="mb-3">
            <label>Veterinario ID</label>
            <input type="number" class="form-control" [(ngModel)]="usuarioForm.veterinario_id" name="editarVeterinarioId">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-warning text-white" (click)="guardarCambios()">Guardar Cambios</button>
      </div>
    </div>
  </div>
</div>
