<div class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h5 class="card-title">Listado de Vacunas</h5>
          </div>
          <div class="card-body">
            <!-- Indicador de carga -->
            <div *ngIf="loading" class="alert alert-info">
              <p>Cargando datos...</p>
            </div>

            <!-- Mensaje de error -->
            <div *ngIf="error" class="alert alert-danger">
              {{ error }}
            </div>

            <!-- Tabla de vacunas -->
            <div *ngIf="!loading && vacunas.length > 0" class="table-responsive">
              <table class="table table-striped table-hover">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Fabricante</th>
                    <th>Dosis Requeridas</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let vacuna of vacunas">
                    <td>{{ vacuna.id }}</td>
                    <td>{{ vacuna.nombre }}</td>
                    <td>{{ vacuna.fabricante }}</td>
                    <td>{{ vacuna.dosis_requeridas }}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Mensaje cuando no hay vacunas -->
            <div *ngIf="!loading && vacunas.length === 0 && !error" class="alert alert-warning">
              No hay vacunas para mostrar
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
